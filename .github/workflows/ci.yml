name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        shell: bash
        run: for f in lib/*.mjs bin/*.mjs test/*.mjs; do node --check "$f"; done
      - name: Tests
        run: node test/smoke.mjs
      - name: CLI help renders
        run: node bin/recall.mjs --help
      - name: A miss exits non-zero without crashing
        shell: bash
        # bash runs with -e, so the failing command must be inside the `if`
        # or the step aborts before the assertion.
        run: |
          if node bin/recall.mjs zzzznotpresent --projects ./nope; then
            echo "expected a non-zero exit for no matches"
            exit 1
          fi
